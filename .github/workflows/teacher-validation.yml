name: Validar IA Professor (sem publicar)
on:
  push:
    branches:
      - feat/ia-professor-20261031
  pull_request:
    branches: [main]
    paths:
      - 'knowledge_bridge/**'
      - 'tests/**'
      - 'TRAMA.spec'
      - 'TRAMA_Instalador.iss'
      - '.github/workflows/teacher-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teacher-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feat/teacher-')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validar JavaScript
        run: |
          node --check knowledge_bridge/ui/teacher.js
          node --check knowledge_bridge/ui/app.js
          node --check knowledge_bridge/ui/library.js
      - name: Testes
        run: python -m unittest discover -s tests -q
      - name: Adversariais
        run: python qa_adversarial.py
      - name: Auditoria
        run: python tools/audit_release.py
  installer:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feat/teacher-')
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Executavel
        run: python -m PyInstaller --clean --noconfirm TRAMA.spec
      - name: Self test do executavel
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\TRAMA\TRAMA.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $result.WaitForExit(90000)) {
            Stop-Process -Id $result.Id -Force -ErrorAction SilentlyContinue
            throw 'Exe self-test exceeded 90 seconds'
          }
          $result.Refresh()
          if ($result.ExitCode -ne 0) { throw 'Exe self-test failed' }
      - name: Instalador local
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'TRAMA_Instalador.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Instalar reinstalar e desinstalar
        shell: pwsh
        run: ./tools/windows_installer_smoke.ps1

  browser:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feat/teacher-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar navegador de teste
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Testar UI e consentimento de reanalise
        run: node tests/ui_smoke.mjs
      - name: Gerar HTML realmente embutido no executavel
        run: |
          python -c "from pathlib import Path; from knowledge_bridge.bridge import load_local_ui; p=Path('ui-smoke-artifacts/native-bundle.html'); p.parent.mkdir(exist_ok=True); p.write_text(load_local_ui(),encoding='utf-8')"
      - name: Repetir testes na versao embutida
        env:
          TRAMA_BUNDLED_HTML: ui-smoke-artifacts/native-bundle.html
        run: node tests/ui_smoke.mjs
      - name: Guardar capturas para revisao visual
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teacher-v2-ui-screenshots
          path: ui-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
