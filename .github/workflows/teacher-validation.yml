name: Validar IA Professor (sem publicar)
on:
  push:
    branches:
      - feat/ia-professor-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validar JavaScript
        run: |
          node --check knowledge_bridge/ui/teacher.js
          node --check knowledge_bridge/ui/app.js
          node --check knowledge_bridge/ui/library.js
      - name: Testes
        run: python -m unittest discover -s tests -q
      - name: Adversariais
        run: python qa_adversarial.py
      - name: Auditoria
        run: python tools/audit_release.py
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Executavel
        run: python -m PyInstaller --clean --noconfirm TRAMA.spec
      - name: Self test do executavel
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\TRAMA\TRAMA.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Exe self-test failed' }
      - name: Instalador local
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'TRAMA_Instalador.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Instalar reinstalar e desinstalar
        shell: pwsh
        run: ./tools/windows_installer_smoke.ps1
