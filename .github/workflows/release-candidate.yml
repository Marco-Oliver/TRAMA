name: Validar candidata TRAMA 2.0.0 (sem publicação)
on:
  push:
    branches:
      - release/v2.0.0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Checar JavaScript
        run: |
          node --check knowledge_bridge/ui/app.js
          node --check knowledge_bridge/ui/teacher.js
          node --check knowledge_bridge/ui/library.js
      - name: Conferir versão
        run: python -c "from knowledge_bridge.update_service import VERSION; assert VERSION == '2.0.0'"
      - name: Testes de regressão
        run: python -m unittest discover -s tests -q
      - name: Testes adversariais
        run: python qa_adversarial.py
      - name: Auditoria de fontes
        run: python tools/audit_release.py
  instalador:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Validar release
        shell: pwsh
        run: |
          python tools/audit_release.py
          $version = python -c 'from knowledge_bridge.update_service import VERSION; print(VERSION)'
          if ($version -ne '2.0.0') { throw 'Versão diverge do release' }
      - name: Compilar executável
        run: python -m PyInstaller --clean --noconfirm TRAMA.spec
      - name: Verificar executável e IA Professor embarcada
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\TRAMA\TRAMA.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw 'Self test falhou' }
      - name: Compilar instalador sem publicar
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'TRAMA_Instalador.iss'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'release\TRAMA_Setup.exe')) { throw 'Falha no instalador' }
      - name: Instalar reinstalar desinstalar
        shell: pwsh
        run: ./tools/windows_installer_smoke.ps1
      - name: Upgrade 1.9.0 para 2.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/windows_upgrade_smoke.ps1
