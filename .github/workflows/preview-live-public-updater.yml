name: Testar atualizador da Preview no GitHub publico

on:
  push:
    branches: [feat/v2.2.0-automation-foundations]
    paths:
      - '.github/workflows/preview-live-public-updater.yml'
      - 'tools/qa_preview_public_updater.py'

permissions:
  contents: read

jobs:
  real-download:
    if: github.repository == 'Marco-Oliver/TRAMA'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar API publica e baixar EXE com SHA-256 usando codigo real do TRAMA
        shell: pwsh
        run: python tools/qa_preview_public_updater.py
