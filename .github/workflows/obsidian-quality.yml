name: Validar Obsidian excelente (sem publicar instalador)
on:
  push:
    branches:
      - feat/obsidian-excelente-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Testes completos
        run: python -m unittest discover -s tests -q
      - name: Cenários adversariais
        run: python qa_adversarial.py
      - name: Auditoria da distribuição
        run: python tools/audit_release.py
