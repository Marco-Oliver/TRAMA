name: Auditoria completa — personas, visual e segurança
on:
  push:
    branches:
      - fix/quality-personas-ui-security-20261031
      - fix/security-hardening-20261102
      - feat/grafo-conexoes
      - feat/github-por-aula
  pull_request:
    branches:
      - feat/v2.2.0-automation-foundations
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-security-hardening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full-audit]')) && 35 || 12 }}
    strategy:
      fail-fast: false
      matrix:
        # Normal pushes run only fast Linux tests; opt in to full QA with [full-audit].
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full-audit]')) && '["ubuntu-latest","windows-2022"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Checar sintaxe Python
        run: python -m compileall -q knowledge_bridge tests
      - name: Executar todos os testes desde o início
        run: python -m unittest discover -s tests -q
      - name: Executar cenários adversariais
        run: python qa_adversarial.py
      - name: Auditoria de arquivos e possíveis credenciais
        run: python tools/audit_release.py
      - name: Auditoria de vulnerabilidades das dependências Python
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Auditoria estática de padrões perigosos Python
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --disable-pip-version-check bandit
          python -m bandit -r knowledge_bridge -ll -ii
      - name: Conferir sintaxe JS
        run: |
          node --check knowledge_bridge/ui/library.js
          node --check knowledge_bridge/ui/graph.js
          node --check knowledge_bridge/ui/app.js
          node --check knowledge_bridge/ui/teacher.js
          node --check knowledge_bridge/ui/study.js
          node --check knowledge_bridge/ui/projects.js
  browser:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full-audit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Testar visual original e tentativas de injeção
        run: node tests/ui_smoke.mjs
      - name: Preparar o HTML exato embutido no executável
        run: |
          python -c "from pathlib import Path; from knowledge_bridge.bridge import load_local_ui; p=Path('ui-smoke-artifacts/native-bundle.html'); p.parent.mkdir(exist_ok=True); p.write_text(load_local_ui(),encoding='utf-8')"
      - name: Testar HTML empacotado e tentativas de injeção
        env:
          TRAMA_BUNDLED_HTML: ui-smoke-artifacts/native-bundle.html
        run: node tests/ui_smoke.mjs
      - name: Salvar capturas das telas testadas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-trama-auditadas
          path: ui-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
  installer:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[full-audit]'))
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências de build
        run: python -m pip install --disable-pip-version-check -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Compilar executável do zero
        run: python -m PyInstaller --clean --noconfirm TRAMA.spec
      - name: Auto-teste instalado
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\TRAMA\TRAMA.exe').Path
          $result = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          try {
            Wait-Process -Id $result.Id -Timeout 90 -ErrorAction Stop
          } catch {
            Stop-Process -Id $result.Id -Force -ErrorAction SilentlyContinue
            throw 'Auto-teste do executável excedeu 90 segundos ou falhou.'
          }
          $result.Refresh()
          if ($result.ExitCode -ne 0) { throw "Executável falhou: $($result.ExitCode)" }
      - name: Compilar instalador sem publicar
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'TRAMA_Instalador.iss'
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilação do instalador" }
      - name: Testar instalação reinstalação e desinstalação
        shell: pwsh
        run: ./tools/windows_installer_smoke.ps1

      - name: Validar upgrade oficial 2.2.4 para 2.2.5 com dados fictícios
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/windows_upgrade_smoke.ps1 -LegacyVersion 'v2.2.4'
