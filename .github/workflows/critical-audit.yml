name: Validar correções críticas sem publicar instalador
on:
  push:
    branches:
      - fix/critical-audit-20261031
      - fix/aula-02-local-fidelity
      - fix/aula02-canonical-links-people
      - feat/official-academy-docs-material
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Regression and adversarial (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Independent adversarial tests
        run: python qa_adversarial.py
      - name: Packaging source audit
        run: python tools/audit_release.py
