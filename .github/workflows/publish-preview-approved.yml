name: Publicar Preview aprovada 2.2.0 (somente prerelease)

on:
  push:
    branches: [feat/v2.2.0-automation-foundations]
    paths:
      - 'docs/preview-publish-request.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: trama-preview-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Marco-Oliver/TRAMA' && github.ref == 'refs/heads/feat/v2.2.0-automation-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir autorização explícita e build aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=docs/preview-publish-request.json
          RUN_ID=41894709679
          RELEASE_TAG=v2.2.0-preview.207
          SOURCE_SHA=a78b61e50bb65c752575564f81b59b1076cfdffa
          EXPECTED_SHA=a6966cf0d8baeac0c797ccb09490b7170593863d7c31a7630e74a0fe54748144
          jq -e --arg run "$RUN_ID" --arg tag "$RELEASE_TAG" --arg src "$SOURCE_SHA" --arg hash "$EXPECTED_SHA" \
            '.authorized == true and (.run_id | tostring) == $run and .tag == $tag and .source_sha == $src and .sha256 == $hash' "$REQUEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" | jq -e --arg src "$SOURCE_SHA" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $src and .run_number == 207 and .head_branch == "feat/v2.2.0-automation-foundations"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" | jq -e \
            '[.jobs[].conclusion] | length == 4 and all(. == "success")'
          # Require an independent Windows test of the real 189 -> 207 installer upgrade.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41896753352" | jq -e \
            '.status == "completed" and .conclusion == "success" and .head_branch == "feat/v2.2.0-automation-foundations"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41896753352/jobs?per_page=100" | jq -e \
            '.total_count == 1 and .jobs[0].conclusion == "success"'
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Essa prerelease já existe; não substituir assets.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/preview"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name TRAMA-v220-PR5-Preview-ISOLADA-NAO-RELEASE --dir "$RUNNER_TEMP/preview"
          echo 'Arquivos recuperados do artefato validado:'
          find "$RUNNER_TEMP/preview" -type f -printf '%P\n'
          test "$(find "$RUNNER_TEMP/preview" -type f | wc -l)" -eq 2
          SETUP_PATH="$(find "$RUNNER_TEMP/preview" -type f -name TRAMA_Preview_Setup.exe -print -quit)"
          CHECK_PATH="$(find "$RUNNER_TEMP/preview" -type f -name SHA256SUMS-Preview.txt -print -quit)"
          test -n "$SETUP_PATH"
          test -n "$CHECK_PATH"
          test "$(dirname "$SETUP_PATH")" = "$(dirname "$CHECK_PATH")"
          cd "$(dirname "$SETUP_PATH")"
          # Windows PowerShell wrote the manifest with CRLF; keep the
          # published original, normalize line endings only for CI checks.
          tr -d '\r' < SHA256SUMS-Preview.txt | grep -Eqi "^${EXPECTED_SHA}  TRAMA_Preview_Setup.exe$"
          sha256sum --check <(tr -d '\r' < SHA256SUMS-Preview.txt)
          # A release targeting a workflow-changing commit requires a token
          # with Workflows:write. GITHUB_TOKEN cannot get that permission.
          # Pre-create the exact lightweight tag via Git refs (Contents:write),
          # verify it is immutably anchored, and publish using the existing tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" | jq -e --arg src "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $src'
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" | jq -e --arg src "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $src'
          fi
          gh release create "$RELEASE_TAG" TRAMA_Preview_Setup.exe SHA256SUMS-Preview.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title 'TRAMA 2.2.0 Preview — build 207' \
            --notes 'Preview experimental isolada. Inclui revisão da aula A137, proteções adicionais e atualização pelo aplicativo. O upgrade real da 189 foi testado; não é versão estável.'
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft,assets | jq -e \
            --arg tag "$RELEASE_TAG" '.tagName == $tag and .isPrerelease == true and .isDraft == false and ([.assets[].name] | sort) == (["SHA256SUMS-Preview.txt", "TRAMA_Preview_Setup.exe"] | sort)'
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" | jq -e --arg src "$SOURCE_SHA" '.object.sha == $src'
          # Verify that the actual public app updater discovers and downloads
          # this release, checks the SHA, and ignores the stable channel.
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from knowledge_bridge.update_service import (
              check_preview_release, download_verified_preview_installer,
              check_release, VERSION,
          )

          repo = "Marco-Oliver/TRAMA"
          target = "v2.2.0-preview.207"
          expected = "a6966cf0d8baeac0c797ccb09490b7170593863d7c31a7630e74a0fe54748144"
          update = check_preview_release(repo, "2.2.0-preview.189")
          assert update["ok"] and update["available"] and update["version"] == target, update
          assert not check_preview_release(repo, "2.2.0-preview.207")["available"]
          with TemporaryDirectory(prefix="trama-public-preview-check-") as td:
              downloaded = download_verified_preview_installer(
                  repo, "2.2.0-preview.189", td)
              assert downloaded["ok"], downloaded
              path = Path(downloaded["path"])
              assert path.name == "TRAMA_Preview_Setup_v2.2.0-preview.207.exe"
              assert downloaded["sha256"] == expected
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          stable = check_release(repo)
          assert stable["ok"] and stable["version"] == "v2.1.0" and not stable["available"], stable
          assert VERSION == "2.1.0"
          print("PASS: public updater discovers and downloads 207 with verified SHA-256; stable 2.1.0 unchanged.")
          PY

